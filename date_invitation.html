<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fff0f6" />
  <title>우리 데이트할래요? 💕</title>

  <style>
    :root {
      --bg1: #ffe5ef;
      --bg2: #fff4f8;
      --bg3: #fffaf2;

      --pink: #ff86aa;
      --pink-deep: #ff628f;
      --pink-soft: #ffd6e4;

      --cream: #fffdf9;
      --brown: #6b4853;
      --muted: #aa8993;

      --line: rgba(255, 156, 187, .25);
      --shadow: 0 22px 60px rgba(231, 102, 143, .19);
      --card: rgba(255, 255, 255, .82);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 22px;
      display: flex;
      align-items: center;
      justify-content: center;

      font-family:
        "Apple SD Gothic Neo",
        "Pretendard",
        "Noto Sans KR",
        "Malgun Gothic",
        sans-serif;

      color: var(--brown);
      background:
        radial-gradient(circle at 12% 8%, rgba(255,255,255,.95) 0 5%, transparent 22%),
        radial-gradient(circle at 90% 12%, rgba(255,235,197,.55), transparent 25%),
        linear-gradient(145deg, var(--bg1), var(--bg2) 48%, var(--bg3));
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    /* ------------------------------
       Background decoration
       ------------------------------ */

    .bg-decoration,
    .floating-layer,
    .confetti-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .bg-decoration {
      z-index: 0;
    }

    .blob {
      position: absolute;
      border-radius: 999px;
      filter: blur(2px);
      opacity: .65;
    }

    .blob.one {
      width: 150px;
      height: 150px;
      left: -55px;
      top: 15%;
      background: #ffd8e7;
    }

    .blob.two {
      width: 110px;
      height: 110px;
      right: -36px;
      bottom: 12%;
      background: #ffe8b9;
    }

    .sparkle {
      position: absolute;
      font-size: 22px;
      opacity: .52;
      animation: breathe 3.5s ease-in-out infinite;
    }

    .sparkle.s1 { left: 9%; top: 11%; }
    .sparkle.s2 { right: 11%; top: 19%; animation-delay: .8s; }
    .sparkle.s3 { left: 12%; bottom: 12%; animation-delay: 1.6s; }
    .sparkle.s4 { right: 9%; bottom: 17%; animation-delay: 2.2s; }

    @keyframes breathe {
      0%, 100% { transform: scale(.9) rotate(-6deg); opacity: .35; }
      50% { transform: scale(1.18) rotate(6deg); opacity: .78; }
    }

    .floating-layer {
      z-index: 4;
    }

    .floating-heart {
      position: absolute;
      bottom: -40px;
      animation: float-up linear forwards;
      opacity: 0;
    }

    @keyframes float-up {
      0% {
        transform: translateY(0) scale(.65) rotate(0);
        opacity: 0;
      }

      12% {
        opacity: .85;
      }

      100% {
        transform: translateY(-112vh) scale(1.15) rotate(26deg);
        opacity: 0;
      }
    }

    .confetti-layer {
      z-index: 20;
    }

    .confetti {
      position: absolute;
      top: -45px;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(115vh) rotate(480deg);
        opacity: .2;
      }
    }

    /* ------------------------------
       Main card
       ------------------------------ */

    .app {
      position: relative;
      z-index: 2;

      width: min(100%, 470px);
      min-height: 590px;
      padding: 28px 24px 24px;

      display: flex;
      flex-direction: column;

      background: var(--card);
      border: 1px solid rgba(255,255,255,.82);
      border-radius: 34px;

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

      box-shadow:
        var(--shadow),
        inset 0 0 0 1px rgba(255,255,255,.4);

      overflow: hidden;
    }

    .top-sticker {
      position: absolute;
      right: 19px;
      top: 17px;
      transform: rotate(7deg);
      padding: 6px 10px;

      font-size: 12px;
      font-weight: 800;
      color: var(--pink-deep);

      background: #fff4be;
      border-radius: 8px;
      box-shadow: 0 6px 12px rgba(166, 113, 91, .12);
    }

    .progress {
      display: flex;
      gap: 7px;
      margin: 3px 62px 27px 0;
    }

    .progress-dot {
      height: 7px;
      flex: 1;
      border-radius: 999px;
      background: #f4dce4;
      transition: .35s ease;
    }

    .progress-dot.active {
      background: linear-gradient(90deg, #ffa1bd, #ff739e);
      box-shadow: 0 3px 8px rgba(255, 98, 143, .25);
    }

    .step {
      display: none;
      flex: 1;
      width: 100%;
    }

    .step.active {
      display: flex;
      flex-direction: column;
      animation: step-in .43s cubic-bezier(.2,.8,.25,1) both;
    }

    @keyframes step-in {
      from {
        opacity: 0;
        transform: translateY(13px) scale(.97);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .hero {
      margin: auto 0;
      text-align: center;
    }

    .character {
      width: 112px;
      height: 112px;
      margin: 0 auto 21px;

      display: grid;
      place-items: center;

      font-size: 62px;

      background:
        radial-gradient(circle at 35% 30%, #fff 0 8%, transparent 9%),
        linear-gradient(145deg, #fff, #ffe3ed);

      border: 1px solid #ffe0e9;
      border-radius: 38% 55% 43% 52%;

      box-shadow:
        0 12px 30px rgba(255, 121, 161, .16),
        inset 0 -8px 20px rgba(255, 192, 211, .28);

      animation: character-wiggle 2.8s ease-in-out infinite;
    }

    @keyframes character-wiggle {
      0%, 100% { transform: rotate(-2deg) translateY(0); }
      50% { transform: rotate(2deg) translateY(-5px); }
    }

    h1 {
      margin: 0;
      font-size: clamp(27px, 7vw, 36px);
      line-height: 1.28;
      letter-spacing: -.055em;
    }

    .highlight {
      position: relative;
      display: inline-block;
      color: var(--pink-deep);
    }

    .highlight::after {
      content: "";
      position: absolute;
      left: -2px;
      right: -2px;
      bottom: 1px;
      height: 9px;
      z-index: -1;
      border-radius: 999px;
      background: #ffe3a6;
      opacity: .65;
    }

    .subtitle {
      margin: 14px auto 0;
      max-width: 350px;

      font-size: 14px;
      line-height: 1.75;
      color: var(--muted);
      word-break: keep-all;
    }

    .tiny-note {
      margin-top: 11px;
      font-size: 12px;
      color: #bf9ba6;
    }

    /* ------------------------------
       Buttons
       ------------------------------ */

    .button-row {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }

    .btn {
      min-height: 53px;
      padding: 14px 21px;
      border: 0;
      border-radius: 999px;

      font-weight: 800;
      letter-spacing: -.025em;

      cursor: pointer;
      transition:
        transform .18s ease,
        box-shadow .18s ease,
        background .18s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn:active {
      transform: scale(.97);
    }

    .btn-primary {
      flex: 1;
      color: white;

      background:
        linear-gradient(135deg, #ff99b9, var(--pink-deep));

      box-shadow:
        0 11px 25px rgba(255, 98, 143, .30),
        inset 0 1px rgba(255,255,255,.25);
    }

    .btn-soft {
      min-width: 105px;
      color: #9f7c86;
      background: #f4ebee;
    }

    .btn-outline {
      width: 100%;
      margin-top: 9px;

      color: #a57b87;
      background: #fff;
      border: 1.5px solid #f4ceda;
    }

    .runaway {
      transition: left .12s ease, top .12s ease, transform .12s ease;
    }

    .runaway.running {
      position: fixed;
      z-index: 50;
      margin: 0;
    }

    /* ------------------------------
       Choice screens
       ------------------------------ */

    .step-head {
      text-align: center;
      margin-bottom: 19px;
    }

    .mini-character {
      display: inline-block;
      margin-bottom: 9px;
      font-size: 39px;
      animation: bounce-soft 2.2s ease-in-out infinite;
    }

    @keyframes bounce-soft {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .step-title {
      margin: 0;
      font-size: 24px;
      line-height: 1.4;
      letter-spacing: -.045em;
    }

    .step-desc {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .choice-list {
      display: grid;
      gap: 10px;
      overflow-y: auto;
      padding: 3px 3px 5px;
      max-height: 355px;
      scrollbar-width: thin;
      scrollbar-color: #f4c4d3 transparent;
    }

    .choice-label {
      display: block;
      position: relative;
      cursor: pointer;
    }

    .choice-label input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .place-card {
      position: relative;
      padding: 15px 15px 14px;

      display: flex;
      align-items: center;
      gap: 13px;

      text-align: left;

      background: rgba(255,255,255,.88);
      border: 1.5px solid #f4d9e2;
      border-radius: 21px;

      box-shadow: 0 7px 20px rgba(202, 110, 137, .07);

      transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;
    }

    .choice-label:hover .place-card {
      transform: translateY(-2px);
    }

    .choice-label input:checked + .place-card {
      border-color: #ff8eb0;
      background:
        linear-gradient(145deg, #fff, #fff2f7);

      box-shadow:
        0 10px 24px rgba(255, 111, 156, .17),
        inset 0 0 0 2px rgba(255,255,255,.65);
    }

    .place-emoji {
      width: 50px;
      height: 50px;
      flex: 0 0 50px;

      display: grid;
      place-items: center;

      font-size: 25px;
      background: #fff2f6;
      border-radius: 17px;
    }

    .place-content {
      min-width: 0;
      flex: 1;
    }

    .place-name {
      margin-bottom: 4px;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: -.035em;
    }

    .place-desc {
      font-size: 12px;
      color: var(--muted);
    }

    .place-map {
      display: inline-block;
      margin-top: 7px;

      font-size: 11px;
      font-weight: 800;
      color: var(--pink-deep);
      text-decoration: none;
    }


    .place-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .place-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 8px;

      font-size: 10.5px;
      font-weight: 800;
      line-height: 1;

      color: #9a6c7a;
      background: #fff7fa;
      border: 1px solid #f4d4df;
      border-radius: 999px;
    }

    .place-details {
      display: grid;
      gap: 5px;
      margin-top: 9px;
      padding-top: 9px;
      border-top: 1px dashed #f1d7df;
    }

    .place-detail {
      display: grid;
      grid-template-columns: 18px 52px 1fr;
      gap: 5px;
      align-items: start;

      font-size: 11px;
      line-height: 1.45;
      color: #8f737c;
    }

    .place-detail strong {
      font-weight: 800;
      color: #9a6c7a;
    }

    .place-detail span:last-child {
      min-width: 0;
      word-break: keep-all;
    }

    .place-note {
      margin-top: 8px;
      padding: 8px 10px;

      font-size: 10.5px;
      line-height: 1.5;
      color: #9a7480;

      background: #fff9f2;
      border: 1px solid #f6e3cb;
      border-radius: 12px;
    }

    .radio-heart {
      width: 29px;
      height: 29px;
      flex: 0 0 29px;

      display: grid;
      place-items: center;

      font-size: 14px;

      color: #dfc1ca;
      background: #fff;
      border: 1px solid #ead7dd;
      border-radius: 50%;

      transition: .2s ease;
    }

    .choice-label input:checked + .place-card .radio-heart {
      color: #fff;
      border-color: var(--pink);
      background: var(--pink);
      transform: scale(1.08);
    }

    .step-bottom {
      margin-top: auto;
      padding-top: 15px;
    }

    .next-btn {
      width: 100%;
    }

    .next-btn:disabled {
      opacity: .42;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* ------------------------------
       Final screen
       ------------------------------ */

    .final {
      text-align: center;
      margin: auto 0;
    }

    .final-badge {
      width: 90px;
      height: 90px;
      margin: 0 auto 17px;

      display: grid;
      place-items: center;

      font-size: 48px;

      background: #fff;
      border-radius: 50%;
      border: 5px solid #ffe3ec;

      box-shadow:
        0 13px 32px rgba(255, 112, 157, .18);
    }

    .summary {
      margin: 22px 0 18px;
      padding: 17px;

      text-align: left;

      background:
        linear-gradient(145deg, #fffafd, #fff2f7);

      border: 1px solid #f6d3de;
      border-radius: 23px;
    }

    .summary-title {
      margin-bottom: 12px;
      text-align: center;
      font-weight: 900;
      color: var(--pink-deep);
    }

    .summary-row {
      display: grid;
      grid-template-columns: 29px 56px 1fr;
      align-items: center;
      gap: 5px;

      padding: 11px 4px;
      border-bottom: 1px dashed #f1ced9;

      font-size: 13px;
    }

    .summary-row:last-child {
      border-bottom: 0;
    }

    .summary-key {
      color: var(--muted);
    }

    .summary-value {
      text-align: right;
      font-weight: 800;
      word-break: keep-all;
    }

    .button-stack {
      display: grid;
      gap: 9px;
    }

    /* ------------------------------
       Capture card
       ------------------------------ */

    .capture-wrap {
      position: fixed;
      left: -9999px;
      top: 0;
      width: 430px;
      padding: 30px;
      background: #ffeaf2;
    }

    .capture-card {
      position: relative;
      padding: 34px 27px 28px;

      text-align: center;

      color: #6b4853;
      background:
        radial-gradient(circle at 12% 9%, #fff 0 4%, transparent 18%),
        linear-gradient(145deg, #fffafd, #ffe7f0);

      border: 3px solid white;
      outline: 1px solid #ffc8da;
      border-radius: 29px;

      box-shadow: 0 16px 32px rgba(227, 109, 146, .20);
    }

    .capture-deco {
      position: absolute;
      font-size: 25px;
      opacity: .75;
    }

    .capture-deco.tl {
      left: 17px;
      top: 13px;
    }

    .capture-deco.br {
      right: 17px;
      bottom: 13px;
    }

    .capture-icon {
      font-size: 49px;
      margin-bottom: 8px;
    }

    .capture-title {
      font-size: 25px;
      font-weight: 900;
      color: #ff628f;
      letter-spacing: -.04em;
    }

    .capture-sub {
      margin: 5px 0 19px;
      font-size: 11px;
      letter-spacing: .18em;
      color: #b68b98;
    }

    .capture-list {
      padding: 5px 15px;

      text-align: left;

      background: rgba(255,255,255,.82);
      border: 1px solid #f4ceda;
      border-radius: 18px;
    }

    .capture-row {
      display: grid;
      grid-template-columns: 34px 58px 1fr;
      align-items: center;

      padding: 13px 2px;
      border-bottom: 1px dashed #f0ced9;
    }

    .capture-row:last-child {
      border-bottom: 0;
    }

    .capture-row strong {
      text-align: right;
      font-size: 13px;
    }

    .capture-foot {
      margin-top: 20px;
      font-weight: 900;
      color: #ff719c;
    }

    /* ------------------------------
       Toast
       ------------------------------ */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 100;

      max-width: calc(100% - 36px);
      padding: 11px 17px;

      opacity: 0;
      transform: translate(-50%, 20px);

      color: white;
      font-size: 13px;
      font-weight: 800;

      background: rgba(91, 64, 73, .90);
      border-radius: 999px;

      transition: .25s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 480px) {
      body {
        padding: 13px;
      }

      .app {
        min-height: min(690px, calc(100vh - 26px));
        padding: 23px 17px 18px;
        border-radius: 28px;
      }

      .progress {
        margin-bottom: 23px;
      }

      .character {
        width: 100px;
        height: 100px;
        font-size: 55px;
      }

      .choice-list {
        max-height: 390px;
      }

      .place-card {
        padding: 13px;
      }

      .place-emoji {
        width: 46px;
        height: 46px;
        flex-basis: 46px;
      }
    }
  </style>
</head>

<body>
  <div class="bg-decoration" aria-hidden="true">
    <div class="blob one"></div>
    <div class="blob two"></div>

    <span class="sparkle s1">🌸</span>
    <span class="sparkle s2">✨</span>
    <span class="sparkle s3">🎀</span>
    <span class="sparkle s4">💗</span>
  </div>

  <div class="floating-layer" id="floatingLayer" aria-hidden="true"></div>
  <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>

  <main class="app">
    <div class="top-sticker">for you ♡</div>

    <div class="progress" aria-hidden="true">
      <div class="progress-dot active"></div>
      <div class="progress-dot"></div>
      <div class="progress-dot"></div>
      <div class="progress-dot"></div>
    </div>

    <!-- STEP 1 -->
    <section class="step active" id="step1">
      <div class="hero">
        <div class="character">🐰</div>

        <h1>
          이번에 저랑<br>
          <span class="highlight">데이트</span> 하실래요?
        </h1>

        <p class="subtitle" id="introMessage"></p>

        <div class="button-row" id="acceptPlayground">
          <button class="btn btn-primary" id="yesBtn" type="button">
            좋아요! 💕
          </button>

          <button class="btn btn-soft runaway" id="noBtn" type="button">
            고민해볼게요 🙈
          </button>
        </div>

        <div class="tiny-note">※ 오른쪽 버튼은 조금 수줍음이 많아요</div>
      </div>
    </section>

    <!-- STEP 2 -->
    <section class="step" id="step2">
      <div class="step-head">
        <div class="mini-character">🍽️</div>
        <h2 class="step-title">그럼 저녁은<br>어디가 좋을까요?</h2>
        <p class="step-desc">끌리는 곳 하나만 골라주세요 ♡</p>
      </div>

      <div class="choice-list" id="restaurantList"></div>

      <div class="step-bottom">
        <button
          class="btn btn-primary next-btn"
          id="restaurantNext"
          type="button"
          disabled>
          이 식당이 좋아요 💗
        </button>
      </div>
    </section>

    <!-- STEP 3 -->
    <section class="step" id="step3">
      <div class="step-head">
        <div class="mini-character">☕</div>
        <h2 class="step-title">밥 먹고<br>카페도 같이 가요!</h2>
        <p class="step-desc">분위기 좋은 곳으로 하나 골라주세요 ✨</p>
      </div>

      <div class="choice-list" id="cafeList"></div>

      <div class="step-bottom">
        <button
          class="btn btn-primary next-btn"
          id="cafeNext"
          type="button"
          disabled>
          여기까지 완벽해요 💕
        </button>
      </div>
    </section>

    <!-- STEP 4 -->
    <section class="step" id="step4">
      <div class="final">
        <div class="final-badge">💌</div>

        <h2 class="step-title">데이트 코스<br>정해졌어요!</h2>

        <p class="subtitle">
          골라줘서 고마워요.<br>
          이제 저는 즐거운 데이트 준비만 하면 되겠네요 :)
        </p>

        <div class="summary">
          <div class="summary-title">우리의 데이트 코스 🌷</div>

          <div class="summary-row">
            <span>🍽️</span>
            <span class="summary-key">식당</span>
            <span class="summary-value" id="summaryRestaurant">-</span>
          </div>

          <div class="summary-row">
            <span>☕</span>
            <span class="summary-key">카페</span>
            <span class="summary-value" id="summaryCafe">-</span>
          </div>
        </div>

        <div class="button-stack">
          <button class="btn btn-primary" id="saveBtn" type="button">
            데이트 약속 카드 저장하기 💌
          </button>

          <button class="btn btn-outline" id="copyBtn" type="button">
            선택 결과 복사하기
          </button>

          <button class="btn btn-outline" id="restartBtn" type="button">
            다시 골라보기
          </button>
        </div>
      </div>
    </section>
  </main>

  <!-- 이미지 저장용 -->
  <div class="capture-wrap" id="captureWrap" aria-hidden="true">
    <div class="capture-card">
      <span class="capture-deco tl">🌸</span>
      <span class="capture-deco br">💗</span>

      <div class="capture-icon">💌</div>
      <div class="capture-title">우리의 데이트 약속</div>
      <div class="capture-sub">OUR SWEET DATE</div>

      <div class="capture-list">
        <div class="capture-row">
          <span>🍽️</span>
          <span>식당</span>
          <strong id="captureRestaurant">-</strong>
        </div>

        <div class="capture-row">
          <span>☕</span>
          <span>카페</span>
          <strong id="captureCafe">-</strong>
        </div>
      </div>

      <div class="capture-foot">💕 같이 좋은 시간 보내요 💕</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script>
    /*
      ============================================================
      💗 장소 / 문구 설정
      ============================================================

      아래 CONFIG만 수정하면 화면의 장소 리스트가 자동으로 바뀝니다.

      추가:
      {
        name: "장소 이름",
        description: "짧은 설명",
        category: "음식/카페 카테고리",
        parking: "주차 가능 / 2대 가능 / 인근 공영주차장 등",
        hours: "17:00 ~ 22:00",
        note: "예약 추천 / 분위기 좋음 등",
        url: "네이버 지도 링크",
        icon: "🍝"
      }

      category / parking / hours / note는 선택 항목입니다.
      빈 문자열("")이면 화면에 표시되지 않습니다.

      삭제:
      해당 { ... } 블록을 삭제하면 됩니다.

      ============================================================
    */

    const CONFIG = {
      introMessage:
        "제가 가보고 싶은 곳을 몇 군데 골라봤어요.<br>" +
        "마음에 드는 코스로 직접 골라주세요 🌷",

      restaurants: [
        {
          name: "기분 좋은 식탁",
          description: "이탈리아 음식",
          category: "이탈리안",
          parking: "",
          hours: "",
          note: "",
          url: "https://naver.me/5IS9TIRq",
          icon: "🍝"
        },
        {
          name: "미야자키",
          description: "고기",
          category: "고기 / 구이",
          parking: "",
          hours: "",
          note: "",
          url: "https://naver.me/GL8J3LNO",
          icon: "🥩"
        },
        {
          name: "이당비스트로",
          description: "스테이크",
          category: "스테이크 / 비스트로",
          parking: "",
          hours: "",
          note: "",
          url: "https://naver.me/Fmf6xN9l",
          icon: "🍷"
        }
      ],

      cafes: [
        {
          name: "The november 라운지 수지동천점",
          description: "카페",
          category: "라운지 카페",
          parking: "",
          hours: "",
          note: "",
          url: "https://naver.me/FPn5jiq2",
          icon: "☕"
        },
        {
          name: "The november 라운지 용인둔전점",
          description: "카페",
          category: "라운지 카페",
          parking: "",
          hours: "",
          note: "",
          url: "https://naver.me/5WOQcyHg",
          icon: "🌙"
        },
        {
          name: "KIROTTI 기로띠",
          description: "카페",
          category: "베이커리 카페",
          parking: "",
          hours: "",
          note: "",
          url: "https://naver.me/57VZ8Dfs",
          icon: "🥐"
        },
        {
          name: "정그리다",
          description: "카페",
          category: "감성 카페",
          parking: "",
          hours: "",
          note: "",
          url: "https://naver.me/Fw7iuOOl",
          icon: "🌿"
        }
      ]
    };


    /* ============================================================
       앱 로직
       ============================================================ */

    const state = {
      restaurant: null,
      cafe: null
    };

    let currentStep = 1;
    let noPlaceholder = null;
    let floatingTimer = null;

    const $ = (selector) => document.querySelector(selector);

    const introMessage = $("#introMessage");
    const restaurantList = $("#restaurantList");
    const cafeList = $("#cafeList");

    const restaurantNext = $("#restaurantNext");
    const cafeNext = $("#cafeNext");

    const summaryRestaurant = $("#summaryRestaurant");
    const summaryCafe = $("#summaryCafe");

    const captureRestaurant = $("#captureRestaurant");
    const captureCafe = $("#captureCafe");

    const floatingLayer = $("#floatingLayer");
    const confettiLayer = $("#confettiLayer");

    const yesBtn = $("#yesBtn");
    const noBtn = $("#noBtn");

    introMessage.innerHTML = CONFIG.introMessage;


    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    function renderPlaces(items, groupName, target) {
      if (!items.length) {
        target.innerHTML =
          '<div style="padding:30px;text-align:center;color:#aa8993;">' +
          '등록된 장소가 없어요 🥺' +
          '</div>';
        return;
      }

      target.innerHTML = items.map((item, index) => {
        const tags = [
          item.category ? `<span class="place-tag">🏷️ ${escapeHtml(item.category)}</span>` : "",
          item.parking ? `<span class="place-tag">🚗 ${escapeHtml(item.parking)}</span>` : ""
        ].filter(Boolean).join("");

        const details = [
          item.hours
            ? `<div class="place-detail">
                 <span>🕒</span>
                 <strong>영업</strong>
                 <span>${escapeHtml(item.hours)}</span>
               </div>`
            : "",
          item.parking
            ? `<div class="place-detail">
                 <span>🅿️</span>
                 <strong>주차</strong>
                 <span>${escapeHtml(item.parking)}</span>
               </div>`
            : ""
        ].filter(Boolean).join("");

        return `
          <label class="choice-label">
            <input
              type="radio"
              name="${groupName}"
              value="${escapeHtml(item.name)}"
              data-index="${index}"
            />

            <div class="place-card">
              <div class="place-emoji">
                ${escapeHtml(item.icon || "📍")}
              </div>

              <div class="place-content">
                <div class="place-name">
                  ${escapeHtml(item.name)}
                </div>

                <div class="place-desc">
                  ${escapeHtml(item.description || "")}
                </div>

                ${tags ? `<div class="place-tags">${tags}</div>` : ""}
                ${details ? `<div class="place-details">${details}</div>` : ""}

                ${
                  item.note
                    ? `<div class="place-note">💡 ${escapeHtml(item.note)}</div>`
                    : ""
                }

                ${
                  item.url
                    ? `<a
                         class="place-map"
                         href="${escapeHtml(item.url)}"
                         target="_blank"
                         rel="noopener">
                         네이버 지도 보기 ↗
                       </a>`
                    : ""
                }
              </div>

              <div class="radio-heart">♥</div>
            </div>
          </label>
        `;
      }).join("");
    }


    renderPlaces(
      CONFIG.restaurants,
      "restaurant",
      restaurantList
    );

    renderPlaces(
      CONFIG.cafes,
      "cafe",
      cafeList
    );


    function goStep(step) {
      currentStep = step;

      document.querySelectorAll(".step")
        .forEach(el => el.classList.remove("active"));

      $("#step" + step)?.classList.add("active");

      document.querySelectorAll(".progress-dot")
        .forEach((dot, index) => {
          dot.classList.toggle("active", index < step);
        });

      noBtn.style.display = step === 1 ? "" : "none";

      if (step === 4) {
        startFloatingHearts();
      } else {
        stopFloatingHearts();
      }
    }


    /* ============================================================
       첫 화면: YES / 도망가는 버튼
       ============================================================ */

    yesBtn.addEventListener("click", () => {
      launchConfetti(44);
      setTimeout(() => goStep(2), 260);
    });


    function prepareRunawayButton() {
      if (noBtn.classList.contains("running")) return;

      const rect = noBtn.getBoundingClientRect();

      noPlaceholder = document.createElement("span");
      noPlaceholder.style.width = rect.width + "px";
      noPlaceholder.style.height = rect.height + "px";
      noPlaceholder.style.display = "inline-block";

      noBtn.parentNode.insertBefore(noPlaceholder, noBtn);

      noBtn.classList.add("running");
      document.body.appendChild(noBtn);

      noBtn.style.left = rect.left + "px";
      noBtn.style.top = rect.top + "px";
    }


    function moveNoButton(cursorX, cursorY) {
      prepareRunawayButton();

      const margin = 14;
      const rect = noBtn.getBoundingClientRect();

      const width = rect.width;
      const height = rect.height;

      const maxX = Math.max(
        margin,
        window.innerWidth - width - margin
      );

      const maxY = Math.max(
        margin,
        window.innerHeight - height - margin
      );

      let x;
      let y;

      if (
        typeof cursorX === "number" &&
        typeof cursorY === "number"
      ) {
        const centerX = rect.left + width / 2;
        const centerY = rect.top + height / 2;

        let dx = centerX - cursorX;
        let dy = centerY - cursorY;

        const distance = Math.hypot(dx, dy) || 1;
        const jump = 80 + Math.random() * 55;

        x =
          centerX +
          (dx / distance) * jump -
          width / 2;

        y =
          centerY +
          (dy / distance) * jump -
          height / 2;
      } else {
        x = margin + Math.random() * (maxX - margin);
        y = margin + Math.random() * (maxY - margin);
      }

      x = Math.min(Math.max(margin, x), maxX);
      y = Math.min(Math.max(margin, y), maxY);

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }


    document.addEventListener("mousemove", event => {
      if (currentStep !== 1) return;

      const rect = noBtn.getBoundingClientRect();

      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      const distance = Math.hypot(
        event.clientX - centerX,
        event.clientY - centerY
      );

      if (distance < 72) {
        moveNoButton(event.clientX, event.clientY);
      }
    });


    noBtn.addEventListener(
      "touchstart",
      event => {
        event.preventDefault();

        const touch = event.touches[0];

        moveNoButton(
          touch?.clientX,
          touch?.clientY
        );
      },
      { passive: false }
    );


    noBtn.addEventListener("click", event => {
      event.preventDefault();
      moveNoButton();
    });


    /* ============================================================
       장소 선택
       ============================================================ */

    document.addEventListener("click", event => {
      if (event.target.closest(".place-map")) {
        event.stopPropagation();
      }
    });


    document.addEventListener("change", event => {
      const input = event.target;

      if (!input.matches('input[type="radio"]')) return;

      if (input.name === "restaurant") {
        state.restaurant = input.value;
        restaurantNext.disabled = false;
      }

      if (input.name === "cafe") {
        state.cafe = input.value;
        cafeNext.disabled = false;
      }
    });


    restaurantNext.addEventListener("click", () => {
      if (!state.restaurant) return;

      launchMiniHearts();
      goStep(3);
    });


    cafeNext.addEventListener("click", () => {
      if (!state.cafe) return;

      showFinal();
    });


    function showFinal() {
      summaryRestaurant.textContent =
        state.restaurant || "-";

      summaryCafe.textContent =
        state.cafe || "-";

      captureRestaurant.textContent =
        state.restaurant || "-";

      captureCafe.textContent =
        state.cafe || "-";

      goStep(4);
      launchConfetti(65);
    }


    /* ============================================================
       효과
       ============================================================ */

    function launchConfetti(count = 50) {
      const emojis = [
        "🌸",
        "💗",
        "💕",
        "✨",
        "🎀",
        "💖"
      ];

      for (let i = 0; i < count; i++) {
        const el = document.createElement("span");

        el.className = "confetti";
        el.textContent =
          emojis[Math.floor(Math.random() * emojis.length)];

        el.style.left =
          Math.random() * 100 + "vw";

        el.style.fontSize =
          15 + Math.random() * 17 + "px";

        el.style.animationDuration =
          2.2 + Math.random() * 2 + "s";

        el.style.animationDelay =
          Math.random() * .45 + "s";

        confettiLayer.appendChild(el);

        el.addEventListener(
          "animationend",
          () => el.remove()
        );
      }
    }


    function launchMiniHearts() {
      const emojis = ["💗", "💕", "✨"];

      for (let i = 0; i < 10; i++) {
        setTimeout(() => {
          const heart = document.createElement("span");

          heart.className = "floating-heart";
          heart.textContent =
            emojis[Math.floor(Math.random() * emojis.length)];

          heart.style.left =
            25 + Math.random() * 50 + "vw";

          heart.style.fontSize =
            18 + Math.random() * 9 + "px";

          heart.style.animationDuration =
            2 + Math.random() * 1.2 + "s";

          floatingLayer.appendChild(heart);

          heart.addEventListener(
            "animationend",
            () => heart.remove()
          );
        }, i * 80);
      }
    }


    function startFloatingHearts() {
      stopFloatingHearts();

      const emojis = [
        "💗",
        "💕",
        "🌸",
        "✨",
        "💖"
      ];

      floatingTimer = setInterval(() => {
        const heart = document.createElement("span");

        heart.className = "floating-heart";
        heart.textContent =
          emojis[Math.floor(Math.random() * emojis.length)];

        heart.style.left =
          Math.random() * 100 + "vw";

        heart.style.fontSize =
          17 + Math.random() * 17 + "px";

        heart.style.animationDuration =
          4 + Math.random() * 2.6 + "s";

        floatingLayer.appendChild(heart);

        heart.addEventListener(
          "animationend",
          () => heart.remove()
        );
      }, 420);
    }


    function stopFloatingHearts() {
      if (floatingTimer) {
        clearInterval(floatingTimer);
        floatingTimer = null;
      }
    }


    /* ============================================================
       결과 저장 / 복사
       ============================================================ */

    $("#copyBtn").addEventListener("click", async () => {
      const text =
`데이트 코스 골랐어요 💕

🍽️ 식당
${state.restaurant}

☕ 카페
${state.cafe}

이 코스로 같이 가요 :)`;

      try {
        await navigator.clipboard.writeText(text);
        showToast("선택 결과를 복사했어요 💗");
      } catch {
        showToast("복사가 안 돼서 내용을 띄워드릴게요!");
        setTimeout(() => alert(text), 250);
      }
    });


    $("#saveBtn").addEventListener("click", async () => {
      if (typeof html2canvas !== "function") {
        showToast("이미지 저장 도구를 불러오지 못했어요 🥺");
        return;
      }

      showToast("데이트 약속 카드를 만들고 있어요 🎀");

      try {
        const canvas = await html2canvas(
          $("#captureWrap"),
          {
            backgroundColor: "#ffeaf2",
            scale: 2,
            useCORS: true
          }
        );

        const link = document.createElement("a");

        link.download =
          "우리의_데이트_약속.jpg";

        link.href =
          canvas.toDataURL("image/jpeg", .95);

        document.body.appendChild(link);
        link.click();
        link.remove();

        showToast("저장했어요! 답장으로 보내주세요 💌");
      } catch (error) {
        console.error(error);
        showToast("이미지 저장에 실패했어요 🥺");
      }
    });


    $("#restartBtn").addEventListener("click", () => {
      state.restaurant = null;
      state.cafe = null;

      document.querySelectorAll(
        'input[type="radio"]'
      ).forEach(input => {
        input.checked = false;
      });

      restaurantNext.disabled = true;
      cafeNext.disabled = true;

      resetRunawayButton();
      goStep(1);
    });


    function resetRunawayButton() {
      noBtn.classList.remove("running");
      noBtn.style.left = "";
      noBtn.style.top = "";
      noBtn.style.display = "";

      const playground =
        $("#acceptPlayground");

      playground.appendChild(noBtn);

      if (noPlaceholder) {
        noPlaceholder.remove();
        noPlaceholder = null;
      }
    }


    /* ============================================================
       Toast
       ============================================================ */

    let toastTimer = null;

    function showToast(message) {
      const toast = $("#toast");

      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(toastTimer);

      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2100);
    }
  </script>
</body>
</html>
